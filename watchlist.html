<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="index.css" />
    <title>My Watchlist</title>
  </head>
  <body>
    <main>
      <header class="header">
        <div class="container header-inner">
          <a href="watchlist.html"><h1>My watchlist</h1></a>
          <a href="index.html"><p>Search for movies</p></a>
        </div>
      </header>
      <form action="" class="movie-form" id="movie-form">
        <div class="container">
          <div class="movie-form-container-inner">
            <label for="movie-input"
              ><i
                class="fa-solid fa-magnifying-glass"
                aria-label="Icon for searching input"
              ></i
            ></label>
            <input
              type="text"
              name="movie-input"
              id="movie-input"
              placeholder="Search for a movie"
            />
            <button type="submit">Search</button>
          </div>
        </div>
      </form>
      <section>
        <div class="search-container" id="search-container">
          <div class="container search-container-inner">
            <p>Your watchlist is looking a little empty...</p>
            <a href="index.html"
              ><p>
                <span><i class="fa-solid fa-circle-plus"></i></span>Let's add
                some movies
              </p></a
            >
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
